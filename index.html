    <script>
        // Lucide Icons Init
        window.addEventListener('load', () => {
            lucide.createIcons();
            initWinterSnowAndIceCanvas();
        });

        // Copy to Clipboard System
        function copyToClipboard(text, msg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast(msg || "ID copiado!");
        }

        function copyBioLink() {
            copyToClipboard(window.location.href, "Link da Bio copiado!");
        }

        // Toast Feedback Popup
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Combined Soft Round Snow Particles + Translucent Ice Flakes (❄) Canvas
        function initWinterSnowAndIceCanvas() {
            const canvas = document.getElementById('snowCanvas');
            const ctx = canvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;

            // High-resolution terrain grid for realistic asymmetric snow dunes
            const cols = 160;
            let baseHeights = new Float32Array(cols);

            // Initial realistic snow accumulation so the page already starts with snow
            let baseSnowLevel = Math.min(46, Math.max(24, height * 0.045));
            const maxSnowLevel = Math.min(138, Math.max(76, height * 0.165));
            let waveTime = 0;

            function buildAsymmetricProfile() {
                // Asymmetric wind-swept drift: one side noticeably higher than the other with natural dunes
                const leftHigh = Math.random() > 0.35;
                for (let i = 0; i < cols; i++) {
                    const u = i / (cols - 1); // 0 (left) -> 1 (right)
                    const slopeBias = leftHigh
                        ? (1.38 - u * 0.64)   // Higher drift on the left side, lower toward the right
                        : (0.74 + u * 0.64);  // Lower on the left side, higher drift on the right

                    const dune1 = Math.sin(u * Math.PI * 2.3 + 0.4) * 0.22;
                    const dune2 = Math.cos(u * Math.PI * 5.1 - 1.1) * 0.11;
                    const micro = Math.sin(u * Math.PI * 11.0 + 2.0) * 0.04;

                    baseHeights[i] = Math.max(0.35, slopeBias + dune1 + dune2 + micro);
                }
            }

            buildAsymmetricProfile();

            function resize() {
                const prevHeight = height || window.innerHeight;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;

                const scaleRatio = height / prevHeight;
                baseSnowLevel = Math.min(maxSnowLevel, Math.max(18, baseSnowLevel * scaleRatio));
            }
            resize();
            window.addEventListener('resize', resize);

            // Falling ice flakes (❄) from top to bottom
            const iceFlakes = [];
            const iceCount = 34;
            for (let i = 0; i < iceCount; i++) {
                iceFlakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 14 + 10,
                    speedY: Math.random() * 1.1 + 0.55,
                    opacity: Math.random() * 0.45 + 0.25,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.012
                });
            }

            // Get snow surface height (in px above bottom of screen) at normalized x (0..1)
            function getSnowHeightAtNorm(u, t) {
                const clampedU = Math.max(0, Math.min(1, u));
                const exactIdx = clampedU * (cols - 1);
                const i0 = Math.floor(exactIdx);
                const i1 = Math.min(cols - 1, i0 + 1);
                const frac = exactIdx - i0;

                const gentleDrift = Math.sin(clampedU * Math.PI * 3 + t * 0.35) * 0.03;
                const profileFactor = (baseHeights[i0] * (1 - frac) + baseHeights[i1] * frac) + gentleDrift;

                return Math.max(0, baseSnowLevel * Math.max(0.25, profileFactor));
            }

            function getSnowHeightAtX(x, t) {
                if (width <= 0) return 0;
                return getSnowHeightAtNorm(x / width, t);
            }

            // Draw accumulated crisp white asymmetric snow dunes at the bottom
            function drawAccumulatedSnow() {
                const baseY = height;

                ctx.save();

                // Soft bright white back drift layer for depth
                ctx.beginPath();
                ctx.moveTo(0, baseY);
                for (let i = 0; i < cols; i++) {
                    const x = (i / (cols - 1)) * width;
                    const h = getSnowHeightAtNorm(i / (cols - 1), waveTime * 0.7) * 1.08;
                    ctx.lineTo(x, baseY - h);
                }
                ctx.lineTo(width, baseY);
                ctx.closePath();

                const backGrad = ctx.createLinearGradient(0, baseY - maxSnowLevel * 1.3, 0, baseY);
                backGrad.addColorStop(0, 'rgba(248, 250, 252, 0.55)');
                backGrad.addColorStop(1, 'rgba(226, 232, 240, 0.42)');
                ctx.fillStyle = backGrad;
                ctx.fill();

                // Main bright white snow body (#ffffff / #f8fafc)
                ctx.beginPath();
                ctx.moveTo(0, baseY);
                for (let i = 0; i < cols; i++) {
                    const x = (i / (cols - 1)) * width;
                    const h = getSnowHeightAtNorm(i / (cols - 1), waveTime);
                    ctx.lineTo(x, baseY - h);
                }
                ctx.lineTo(width, baseY);
                ctx.closePath();

                const snowGrad = ctx.createLinearGradient(0, baseY - maxSnowLevel * 1.35, 0, baseY);
                snowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
                snowGrad.addColorStop(0.55, 'rgba(248, 250, 252, 0.94)');
                snowGrad.addColorStop(1, 'rgba(241, 245, 249, 0.86)');

                ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = snowGrad;
                ctx.fill();

                // Subtle soft shading in lower troughs to preserve asymmetric dune realism
                ctx.shadowBlur = 0;
                const shadeGrad = ctx.createLinearGradient(0, baseY - 28, 0, baseY);
                shadeGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                shadeGrad.addColorStop(1, 'rgba(203, 213, 225, 0.25)');
                ctx.fillStyle = shadeGrad;
                ctx.fill();

                // Crisp bright white top edge along the snow surface
                ctx.shadowColor = 'rgba(255, 255, 255, 0.65)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                for (let i = 0; i < cols; i++) {
                    const x = (i / (cols - 1)) * width;
                    const h = getSnowHeightAtNorm(i / (cols - 1), waveTime);
                    const y = baseY - h;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                waveTime += 0.012;

                drawAccumulatedSnow();

                // Draw & update falling ice flakes (❄) strictly from top to bottom
                iceFlakes.forEach(f => {
                    f.y += f.speedY;
                    f.rotation += f.rotSpeed;

                    const surfaceY = height - getSnowHeightAtX(f.x, waveTime);

                    // When an ice flake reaches the snow surface, accumulate snow gradually
                    if (f.y + f.size * 0.35 >= surfaceY) {
                        if (baseSnowLevel < maxSnowLevel) {
                            baseSnowLevel = Math.min(maxSnowLevel, baseSnowLevel + 0.16);
                        }

                        f.y = -24;
                        f.x = Math.random() * width;
                    }

                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rotation);
                    ctx.font = `${f.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.55)';
                    ctx.shadowBlur = 7;
                    ctx.fillStyle = `rgba(248, 250, 252, ${f.opacity})`;
                    ctx.fillText('❄', 0, 0);
                    ctx.restore();
                });

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
